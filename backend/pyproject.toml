[project]
name = "thesis-multi-agent-backend"
version = "0.1.0"
description = "Multi-agent LLM evaluation backend (phase 2 skeleton: auth + schema)"
requires-python = ">=3.13,<3.14"
dependencies = [
    # Web layer — pinned from PyPI metadata, verified 2026-10-07
    "fastapi==0.142.2",
    "uvicorn[standard]==0.54.0",
    "pydantic[email]==2.13.5",
    "pydantic-settings==2.15.0",
    # Database — psycopg[binary] ships aarch64 manylinux wheels, so no build toolchain on the VM
    "psycopg[binary,pool]==3.3.6",
    # Auth
    "argon2-cffi==25.1.0",
    # Ingestion (phase 3) — versions verified on PyPI 2026-10-14
    "pdfplumber==0.11.10",
    "python-docx==1.2.0",
    # Multipart uploads (FR-03)
    "python-multipart==0.0.32",
    # Agent pipeline (phase 4). Versions verified on PyPI 2026-10-14: langgraph 1.2.15 is two days
    # old, while langgraph-checkpoint-postgres 3.2.0 was published the same day, so the boring-pin
    # rule takes 3.1.2 (2026-08-07) instead. The pipeline uses the *sync* PostgresSaver: the known
    # PgBouncer pipeline-mode failure is in the async saver, which this project does not use.
    "langgraph==1.2.15",
    "langgraph-checkpoint-postgres==3.1.2",
    # The provider client speaks HTTP at runtime; httpx was previously only a test dependency.
    "httpx==0.28.1",
    # XLSX export (FR-12). Latest stable, verified on PyPI 2026-10-15.
    "openpyxl==3.1.5",
]
# Phase 3 adds ingestion; verify versions when they are actually used.

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 110
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "S", "SIM"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101", "S105"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
python_version = "3.13"
ignore_missing_imports = true
files = ["app"]
