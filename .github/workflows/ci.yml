name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-24.04
    # A service container in CI is not the same thing as containerising the app: the app itself
    # runs natively on the VM and on the development machine (see DECISIONS.md, 2026-10-07).
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thesis_test
      MIGRATION_DATABASE_URL: postgresql://postgres:postgres@localhost:5432/thesis_test
      ENV: test
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v7
        with:
          version: "0.12.23"
      - name: Install Python and dependencies
        working-directory: backend
        run: |
          uv python install 3.13
          uv sync --locked
      - name: Create test database and migrate
        working-directory: backend
        run: |
          psql "$DATABASE_URL" -c "create database thesis_test" || true
          uv run python -m scripts.migrate
      - name: Lint
        working-directory: backend
        run: uv run ruff check .
      - name: Type check
        working-directory: backend
        run: uv run mypy app
      - name: Tests
        working-directory: backend
        run: uv run pytest -q

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        working-directory: frontend
        run: npm ci
      - name: Lint
        working-directory: frontend
        run: npm run lint
      - name: Type check
        working-directory: frontend
        run: npx tsc --noEmit
      - name: Build
        working-directory: frontend
        run: npm run build
